name: KB3 private archive adapter offline tests
on:
  pull_request:
    paths:
      - src/kb3_private_archive_store.py
      - tests/test_kb3_private_archive_store.py
      - .github/workflows/kb3-private-archive-store-ci.yml
  push:
    branches: [main]
    paths:
      - src/kb3_private_archive_store.py
      - tests/test_kb3_private_archive_store.py
      - .github/workflows/kb3-private-archive-store-ci.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m unittest discover -s tests -p test_kb3_private_archive_store.py -v
