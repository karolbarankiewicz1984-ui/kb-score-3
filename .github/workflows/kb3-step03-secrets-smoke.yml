name: "KB3 Step 03 - API access smoke test"

# Manual only. No schedule, no push trigger, no outputs containing credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb3-step03-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
    steps:
      - name: Check private credentials and make two minimal read-only requests
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          checks = [
              ("API-Football", "API_FOOTBALL_KEY",
               "https://v3.football.api-sports.io/status", "x-apisports-key"),
              ("PitchAPI", "PITCHAPI_API_KEY",
               "https://api.pitchapi.dev/v1/leagues", "X-API-KEY"),
          ]
          results = []
          for label, env_var, url, header in checks:
              key = os.getenv(env_var, "").strip()
              if not key:
                  results.append((label, "FAIL", "MISSING_SECRET"))
                  continue

              # Do not print requests, headers, exception strings, response bodies,
              # tokens or original diagnostic responses.
              try:
                  request = urllib.request.Request(
                      url,
                      headers={header: key, "Accept": "application/json",
                               "User-Agent": "KB3-Smoke-Test/1.0"},
                      method="GET",
                  )
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      raw = response.read(2_000_000)
                  if status != 200:
                      results.append((label, "FAIL", f"HTTP_{status}"))
                      continue
                  body = json.loads(raw)
                  if not isinstance(body, dict) or body.get("errors") or body.get("error"):
                      results.append((label, "FAIL", "API_REPORTED_ERROR"))
                      continue
                  results.append((label, "PASS", "HTTP_200_JSON"))
              except urllib.error.HTTPError as exc:
                  results.append((label, "FAIL", f"HTTP_{exc.code}"))
              except Exception as exc:
                  results.append((label, "FAIL", type(exc).__name__))

          lines = [
              "## KB Score 3.0 - Gate 03 API access",
              "",
              "Manual, two read-only API requests. No secrets or provider payloads logged.",
              "",
              "| Service | Result | Detail |",
              "|---|---|---|",
          ]
          for label, status, detail in results:
              lines.append(f"| {label} | {status} | {detail} |")
          lines += ["", "Budget settings require separate owner verification."]
          summary = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          print("\n".join(f"{name}: {status} ({detail})" for name, status, detail in results))
          if any(status != "PASS" for _, status, _ in results):
              raise SystemExit(1)
          PY
