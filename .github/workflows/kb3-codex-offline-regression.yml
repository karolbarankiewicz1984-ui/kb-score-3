name: KB3 Codex current-main offline regression
on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'migrations/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'migrations/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kb3-codex-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies and YAML test parser
        run: python -m pip install 'catboost==1.2.8' 'cryptography>=42,<47' 'pitchapi==0.1.6' 'PyYAML==6.0.3'
      - name: Run all unique tests with network, fit and evidence writes blocked
        run: python scripts/test_codex_offline.py > offline-tests.log 2>&1
      - name: Check protected files and whitespace
        run: |
          git diff --exit-code -- data models config
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_CODEX_OFFLINE_${{ github.run_id }}_${{ github.run_attempt }}
          path: offline-tests.log
          retention-days: 30
          if-no-files-found: error
