name: KB3 Step14 three-season historical PIT evidence audit

on:
  push:
    branches: [step14/three-season-asof-elo-xg-audit-20261028]
  pull_request:
    paths:
      - 'src/kb3_step14_multiseason_pit.py'
      - 'src/kb3_step14_elo_xg_readiness.py'
      - 'tests/test_step14_multiseason_pit.py'
      - 'tests/test_step14_elo_xg_readiness.py'
      - '.github/workflows/kb3-step14-three-season-asof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-asof-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline negative controls
        run: |
          python -m unittest discover -s tests -p 'test_step14_multiseason_pit.py' -v
          python -m unittest discover -s tests -p 'test_step14_elo_xg_readiness.py' -v
      - name: Read three independently verified old source snapshots and audit retrospective aliases
        run: python -m src.kb3_step14_multiseason_pit --output "$RUNNER_TEMP/multiseason_public_source_proofs.json"
      - name: Independently audit full Elo-chain and team xG prerequisites
        run: |
          python -m src.kb3_step14_elo_xg_readiness --sources "$RUNNER_TEMP/multiseason_public_source_proofs.json" --output "$RUNNER_TEMP/elo_xg_evidence_audit.json"
      - name: Save target-free research evidence as expiring artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step14-3season-public-elo-xg-audit-no-training
          path: |
            ${{ runner.temp }}/multiseason_public_source_proofs.json
            ${{ runner.temp }}/elo_xg_evidence_audit.json
          if-no-files-found: warn
          retention-days: 30
