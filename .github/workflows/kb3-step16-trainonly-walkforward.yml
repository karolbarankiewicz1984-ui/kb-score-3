name: KB3 TRAIN-only historical 3-fold CatBoost research
on:
  workflow_dispatch:
  push:
    branches: [research/step16-trainonly-walkforward-20261101]
    paths:
      - scripts/step16_train_only_walkforward_catboost.py
      - tests/test_step16_train_only_walkforward_catboost.py
      - .github/workflows/kb3-step16-trainonly-walkforward.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing SDK and scientific requirements
        run: python -m pip install --disable-pip-version-check 'catboost==1.2.8' 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Offline guards
        run: |
          python -m compileall -q scripts/step16_train_only_walkforward_catboost.py
          python -m unittest discover -s tests -p 'test_step16_train_only_walkforward_catboost.py' -v
      - name: Real TRAIN-only walk-forward (3 provider reads, no TEST)
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m scripts.step16_train_only_walkforward_catboost --out research/results/STEP16_TRAIN720_WALKFORWARD_2026-11-01.json
          git diff --exit-code -- data/ models/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_TRAIN_ONLY_WALKFORWARD_720_RESEARCH
          path: research/results/STEP16_TRAIN720_WALKFORWARD_2026-11-01.json
          retention-days: 30
          if-no-files-found: warn
