name: "KB3 Step 13 - Retrospective Research Contract"
on:
  push:
    branches: ["feature/step13-*", "main"]
    paths:
      - "src/kb3_step13_retrospective.py"
      - "src/kb3_step13_stability_audit.py"
      - "tests/test_step13_stability_audit.py"
      - "src/kb3_step13_archive_preflight.py"
      - "data/audits/STEP13_ORIGINAL_SEALED_ZIP_PREFLIGHT_2026-10-26.json"
      - "scripts/step13_pitch_retrospective_local.py"
      - "scripts/step13_windows_local_start.ps1"
      - "tests/test_step13_retrospective.py"
      - "tests/test_step13_archive_preflight.py"
      - "tests/test_step13_local_archive.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-retrospective.yml"
  pull_request:
    paths:
      - "src/kb3_step13_retrospective.py"
      - "src/kb3_step13_stability_audit.py"
      - "tests/test_step13_stability_audit.py"
      - "src/kb3_step13_archive_preflight.py"
      - "data/audits/STEP13_ORIGINAL_SEALED_ZIP_PREFLIGHT_2026-10-26.json"
      - "scripts/step13_pitch_retrospective_local.py"
      - "scripts/step13_windows_local_start.ps1"
      - "tests/test_step13_retrospective.py"
      - "tests/test_step13_archive_preflight.py"
      - "tests/test_step13_local_archive.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-retrospective.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-safety-without-private-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed crypto library for sealed archive interface tests
        run: python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Run offline model and anti-leakage regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_step13*.py' -v
      - name: Parse Windows PowerShell 5.1-compatible local owner launcher
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/step13_windows_local_start.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "STEP13_WINDOWS_LAUNCHER_SYNTAX_INVALID"
          }
          $script = Get-Content "scripts/step13_windows_local_start.ps1" -Raw
          if ($script -match "Invoke-WebRequest|Invoke-RestMethod|Start-Transcript|Upload-Artifact|PITCHAPI_API_KEY|API_FOOTBALL_KEY") {
            throw "STEP13_WINDOWS_LAUNCHER_NETWORK_OR_SECRET_EXFILTRATION_FORBIDDEN"
          }
          if (-not $script.Contains("STEP13_RETROSPECTIVE_RESEARCH_RESULT.json")) {
            throw "STEP13_WINDOWS_LAUNCHER_PRIVATE_REPORT_MISSING"
          }
          Write-Host "STEP13_WINDOWS_LAUNCHER_PARSER_AND_LOCAL_ONLY_POLICY_PASS"
      - name: Verify local-only encrypted archive interface and no CI keys
        run: |
          python3 - <<'PY'
          from src.kb3_step13_retrospective import POLICY,retrospective_research
          from src.kb3_step13_baseline import BaselineSafetyError
          try:
              retrospective_research([],policy="VERIFIED_PREMATCH_PIT")
              raise AssertionError("unsafe policy was accepted")
          except BaselineSafetyError as exc:
              assert "EXPLICIT_POLICY_REQUIRED" in str(exc)
          assert POLICY == "RECONSTRUCTED_EVENT_TIME_RESEARCH_NOT_VERIFIED_PIT"
          print("STEP13_RESEARCH_ONLY_POLICY_PASS_NO_REAL_MATCHES_OR_PRIVATE_KEYS")
          PY
      - name: Verify frozen evidence report was a real ZIP-only check, not a backtest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.kb3_split import sha
          from src.kb3_step13_archive_preflight import ZIP_SHA,CIPHER_SHA,CHAIN_SHA
          report=json.loads(Path("data/audits/STEP13_ORIGINAL_SEALED_ZIP_PREFLIGHT_2026-10-26.json").read_text())
          assert report["report_sha256"]==sha({k:v for k,v in report.items() if k!="report_sha256"})
          assert report["zip_sha256"]==ZIP_SHA and report["cipher_sha256"]==CIPHER_SHA
          assert report["source_provenance_chain_sha256"]==CHAIN_SHA
          assert report["zip_size_bytes"]==31907 and report["cipher_size_bytes"]==30168
          assert report["historical_fixture_count_declared"]==1140
          assert report["archive_zip_integrity_verified"]
          assert not report["archive_decrypted"] and not report["real_backtest_performed"]
          assert not report["real_fit_performed"] and not report["real_backtest_metrics_available"]
          assert not report["historical_prematch_pit_proven"]
          assert not report["training_allowed"] and not report["gate13_pass"]
          print("STEP13_ORIGINAL_ENCRYPTED_ZIP_AUDIT_PINNED_NO_DECRYPTION")
          PY
      - name: Regenerate genuine retrospective stability audit from frozen aggregate (no API)
        run: |
          python3 -m src.kb3_step13_stability_audit \
            --output data/audits/STEP13_REAL_RETROSPECTIVE_STABILITY_2026-10-27.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.kb3_split import sha
          p=Path("data/audits/STEP13_REAL_RETROSPECTIVE_STABILITY_2026-10-27.json")
          r=json.loads(p.read_text())
          assert r["report_sha256"] == sha({k:v for k,v in r.items() if k!="report_sha256"})
          assert r["original_aggregate_report_sha256"] == "3d950fff30b57c94a6f71462c7521cfda2cb0b27c666d59d09d274261efca803"
          assert r["validation_total"] == 380 and r["test_rows_read"] == 0
          assert r["fold3_overconfidence_detected_both_methods"]
          assert r["all_eight_elasticity_fits_at_original_grid_upper_edge"]
          assert not r["model_winner_promoted"]
          assert not r["retraining_or_parameter_grid_change_performed"]
          assert not r["training_allowed"] and not r["gate13_pass"]
          print("STEP13_REAL_AGGREGATE_STABILITY_Q3_SAFETY_PASS")
          PY
      - name: Save only aggregate stability JSON as independent artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb3-step13-real-retrospective-stability-aggregate-v06
          path: data/audits/STEP13_REAL_RETROSPECTIVE_STABILITY_2026-10-27.json
          retention-days: 90
          if-no-files-found: error
      - name: Freeze stability audit on reviewed Step13 feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/step13-calibration-stability-audit-v06'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/STEP13_REAL_RETROSPECTIVE_STABILITY_2026-10-27.json
          if ! git diff --cached --quiet; then
            git commit -m "Step13: freeze verified quarterly calibration stability findings (no new provider calls)"
            git push origin HEAD:feature/step13-calibration-stability-audit-v06
          fi
