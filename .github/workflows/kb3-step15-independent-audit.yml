name: KB3 Step15 independent second-score and coherence audit (frozen 374)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  independent-audit-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing PitchAPI client for SECOND independent original score check
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6'
      - name: Independent mathematical invariants and corruption controls
        run: |
          python -m compileall -q scripts/step15_independent_market_audit.py
          python -m unittest discover -s tests -p 'test_step15_independent_market_audit.py' -v
      - name: Download already-completed ONE-SHOT 374 comparison, no model refit
        uses: actions/download-artifact@v4
        with:
          name: KB3_STEP15_INDEPENDENT_CATBOOST_GOALS_374_COMPARISON_FULL
          run-id: 40922276524
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _audit_step15
      - name: Independently replay all 374 real goals and 22 market probabilities
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m scripts.step15_independent_market_audit \
          --source-dir _audit_step15 \
          --out _audit_step15/STEP15_INDEPENDENT_AUDIT.json
      - name: Guard PASS, 2x374 market coherence, 132 independent market metric checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("_audit_step15")
          x=json.load(open(p/"STEP15_INDEPENDENT_AUDIT.json"))
          assert x["status"]=="PASS_INDEPENDENT_SCORE_AND_COHERENCE_VERIFICATION"
          assert x["paired_fixtures"]==374
          assert x["score_checks"]==132
          assert x["all_748_model_by_fixture_market_coherence_checks_pass"]
          assert x["all_22_market_score_pairs_verified"]
          assert x["actual_counts"]=={"brier":0,"log_loss":0}
          assert x["original_test_accessed"] is False
          assert x["production_promotion"] is False
          assert x["historical_provider_pit_certified"] is False
          assert x["formal_step15_pass"] is False
          print("INDEPENDENT_STEP15_AUDIT_PASS_DO_NOT_PROMOTE_ML")
          PY
      - name: Persist full report and frozen model artifacts on research branch (no labels)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p models/research data/forecasts data/audits
          cp _audit_step15/CATBOOST_GOALS_HOME_720.cbm models/research/STEP15_CATBOOST_GOALS_HOME_720_20261029.cbm
          cp _audit_step15/CATBOOST_GOALS_AWAY_720.cbm models/research/STEP15_CATBOOST_GOALS_AWAY_720_20261029.cbm
          cp _audit_step15/STEP15_374_PAIR_GOAL_PROBABILITIES_NO_LABELS.jsonl.gz data/forecasts/STEP15_374_PAIR_GOAL_PROBABILITIES_NO_LABELS_20261029.jsonl.gz
          cp _audit_step15/STEP15_ML_VS_M0_374_FULL_REPORT.json data/audits/STEP15_ML_VS_M0_374_FULL_REPORT_20261029.json
          cp _audit_step15/STEP15_INDEPENDENT_AUDIT.json data/audits/STEP15_INDEPENDENT_SECOND_SCORE_AUDIT_20261029.json
          git config user.name kb3-step15-independent-audit-bot
          git config user.email kb3-step15-audit-bot@users.noreply.github.com
          git add -f models/research/STEP15_CATBOOST_GOALS_HOME_720_20261029.cbm
          git add -f models/research/STEP15_CATBOOST_GOALS_AWAY_720_20261029.cbm
          git add -f data/forecasts/STEP15_374_PAIR_GOAL_PROBABILITIES_NO_LABELS_20261029.jsonl.gz
          git add -f data/audits/STEP15_ML_VS_M0_374_FULL_REPORT_20261029.json
          git add -f data/audits/STEP15_INDEPENDENT_SECOND_SCORE_AUDIT_20261029.json
          if ! git diff --cached --quiet; then
            git commit -m 'step15: freeze real 374 paired ML/M0 scorecard, CatBoost models and independent second result audit'
            git pull --rebase origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: KB3_STEP15_INDEPENDENT_REAL_SCORE_AUDIT_PASS
          path: _audit_step15/STEP15_INDEPENDENT_AUDIT.json
          if-no-files-found: error
          retention-days: 90
