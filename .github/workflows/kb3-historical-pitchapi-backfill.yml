name: KB3 historical PitchAPI multi-stat backfill (research, no model mutation)
on:
  pull_request:
    paths:
      - scripts/kb3_history_gain_first.py
      - tests/test_kb3_history_gain_first.py
      - scripts/kb3_historical_pitchapi_backfill.py
      - scripts/kb3_history_accelerated.py
      - scripts/kb3_history_issue_recheck.py
      - tests/test_kb3_history_accelerated.py
      - tests/test_kb3_history_issue_recheck.py
      - tests/test_kb3_historical_pitchapi_backfill.py
      - src/kb3_historical_feature_quality.py
      - tests/test_kb3_historical_feature_quality.py
      - .github/workflows/kb3-historical-pitchapi-backfill.yml
  push:
    branches: [main]
    paths:
      - scripts/kb3_history_gain_first.py
      - tests/test_kb3_history_gain_first.py
      - scripts/kb3_historical_pitchapi_backfill.py
      - scripts/kb3_history_accelerated.py
      - scripts/kb3_history_issue_recheck.py
      - tests/test_kb3_history_accelerated.py
      - tests/test_kb3_history_issue_recheck.py
      - tests/test_kb3_historical_pitchapi_backfill.py
      - src/kb3_historical_feature_quality.py
      - tests/test_kb3_historical_feature_quality.py
      - .github/workflows/kb3-historical-pitchapi-backfill.yml
  schedule:
    - cron: '15 2,10,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kb3-history-source-backfill-append-only
  cancel-in-progress: false
jobs:
  offline-history-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified compressed historical SQLite snapshot when present
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          source=Path('data/research/historical_multistat/observations.sqlite.gz')
          db=Path('data/research/historical_multistat/observations.sqlite')
          manifest=Path('data/research/historical_multistat/observations.sqlite.gz.manifest.json')
          if source.exists():
              m=json.loads(manifest.read_text())
              raw=gzip.decompress(source.read_bytes())
              assert hashlib.sha256(raw).hexdigest()==m['raw_sha256']
              db.parent.mkdir(parents=True,exist_ok=True)
              db.write_bytes(raw)
              print('RESTORED_VERIFIED_HISTORICAL_SQLITE',len(raw))
          PY
      - name: Install crypto, no provider secret in PR job
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Strict source identity, PIT/TEST exclusion, xG and SQLite regression
        run: |
          python -m compileall -q scripts/kb3_historical_pitchapi_backfill.py scripts/kb3_history_accelerated.py scripts/kb3_history_issue_recheck.py scripts/kb3_history_gain_first.py src/kb3_historical_feature_quality.py tests/test_kb3_historical_pitchapi_backfill.py tests/test_kb3_historical_feature_quality.py tests/test_kb3_history_issue_recheck.py tests/test_kb3_history_accelerated.py
          python -m unittest discover -s tests -p 'test_kb3_historical_pitchapi_backfill.py' -v
          python -m unittest discover -s tests -p 'test_kb3_history_accelerated.py' -v
          python -m unittest discover -s tests -p 'test_kb3_history_gain_first.py' -v
          python -m unittest discover -s tests -p 'test_kb3_history_issue_recheck.py' -v
          python -m unittest discover -s tests -p 'test_kb3_historical_feature_quality.py' -v
          python -m unittest discover -s tests -p 'test_step14_pitchapi_xg_semantics.py' -v
      - name: Audit immutable historical coverage and publication evidence (read-only)
        run: python -m scripts.kb3_history_readonly_quality_gate
      - name: Read-only actual historical cohort gain preflight (offline, zero provider requests)
        run: |
          python - <<'PY'
          from collections import defaultdict,Counter
          import hashlib,json,sqlite3
          from pathlib import Path
          from scripts.kb3_history_gain_first import plan_missing_fixtures,issue_priority_scores
          db=Path('data/research/historical_multistat/observations.sqlite')
          issue=Path('data/research/historical_multistat/issue_rechecks.sqlite')
          assert db.is_file(), 'HISTORICAL_OBSERVATIONS_REQUIRED'
          sha=lambda: hashlib.sha256(db.read_bytes()).hexdigest()
          before=sha();groups=defaultdict(list)
          with sqlite3.connect(db.resolve().as_uri()+'?mode=ro',uri=True) as cn:
              cn.execute('PRAGMA query_only=ON')
              known=set(cn.execute('SELECT scope,match_id FROM observations'))
              for scope,season,mid,ko,home,away in cn.execute(
                  'SELECT scope,season,match_id,kickoff_utc,home_team_id,away_team_id '
                  'FROM finished_fixture_index'):
                  groups[(scope,season)].append({'id':mid,'time_utc':ko,
                      'home_team':{'id':home},'away_team':{'id':away}})
          rank,report=plan_missing_fixtures(groups,known,db,limit=36)
          cards,xg=issue_priority_scores(db,issue)
          assert before==sha(), 'HISTORICAL_GAIN_PRIORITY_MODIFIED_SOURCE'
          assert len(rank)==len({(s,m['id']) for s,season,m in rank})<=36
          assert all((s,m['id']) not in known for s,season,m in rank)
          assert report['estimated_not_observed'] is True
          assert report['formal_pit_eligible'] is False
          assert report['model_or_test_modified'] is False
          assert report['state']=='SOURCE_RANKED_NOT_FETCHED'
          print('KB3_ACTUAL_HISTORY_GAIN_DRYRUN',json.dumps({
              'baseline_observations':len(known),
              'selected_by_scope':dict(Counter(s for s,season,m in rank)),
              'card_issue_impact_scored':len(cards),
              'xg_issue_impact_scored':len(xg),
              'potential':report,
              'unchanged_source_sha256':before},sort_keys=True))
          PY
  live-observed-backfill:
    needs: offline-history-safety
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified compressed historical SQLite snapshot when present
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          source=Path('data/research/historical_multistat/observations.sqlite.gz')
          db=Path('data/research/historical_multistat/observations.sqlite')
          manifest=Path('data/research/historical_multistat/observations.sqlite.gz.manifest.json')
          if source.exists():
              m=json.loads(manifest.read_text())
              raw=gzip.decompress(source.read_bytes())
              assert hashlib.sha256(raw).hexdigest()==m['raw_sha256']
              db.parent.mkdir(parents=True,exist_ok=True)
              db.write_bytes(raw)
              print('RESTORED_VERIFIED_HISTORICAL_SQLITE',len(raw))
          PY
      - name: Install existing PitchAPI provider and encryption libraries
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Capture five independently sealed source batches (max 240 matches), recheck xG and missing yellow cards
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m scripts.kb3_history_accelerated \
            --run-token "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --batches 5
      - name: Validate all encrypted chunks, independent recheck receipts and final rolling report
        run: |
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          from scripts.kb3_historical_pitchapi_backfill import ARCHIVE,DB,MAX_CALLS
          from scripts.kb3_history_issue_recheck import ISSUE_ROOT,ISSUE_DB
          token=os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]
          dirs=list(ARCHIVE.glob("*/run-"+token+"-summary"))
          assert len(dirs)==1,"MISSING_ACCELERATED_SUMMARY"
          folder=dirs[0]
          summary=json.loads((folder/"ACCELERATED_CAPTURE_REPORT.json").read_text())
          quality=json.loads((folder/"ROLLING_AFTER_RECHECK.json").read_text())
          assert summary["completed_batches"]==len(summary["history_batches"])
          assert 1<=summary["completed_batches"]<=5
          assert summary["new_match_stats"]<=240
          assert summary["provider_requests_history"]<=5*MAX_CALLS
          assert summary["new_match_stats"]==sum(x["new"] for x in summary["history_batches"])
          assert summary["effective_xg5_pair_complete"]==quality["totals"]["pair_xg_5_complete"]
          assert summary["cumulative_match_stats"]==quality["totals"]["total_observed_stats_matches"]
          assert quality["gate16_gate17"]=="PENDING"
          assert not quality["full_feature_training_approved"]
          assert not quality["retrospective_provider_original_publication_proven"]
          assert summary["issue_status"] in ("OBSERVED_RECHECK","NO_NEW_ISSUES","RECHECK_ERROR")
          assert summary["original_m0_unchanged"] and summary["protected_english_test_untouched"]
          for part in summary["history_batches"]:
              entries=list(ARCHIVE.glob("*/run-"+part["token"]))
              assert len(entries)==1,"MISSING_AUTHENTIC_ENCRYPTED_BATCH"
              p=entries[0]
              rep=json.loads((p/"HISTORICAL_BACKFILL_REPORT.json").read_text())
              manifest=json.loads((p/"HISTORICAL_SOURCE.manifest.json").read_text())
              encrypted=(p/"HISTORICAL_SOURCE.enc").read_bytes()
              assert hashlib.sha256(encrypted).hexdigest()==rep["source_ciphertext_sha256"]==manifest["ciphertext_sha256"]==part["sha256"]
              assert rep["new_match_stats"]==part["new"]
              assert rep["provider_requests"]<=MAX_CALLS
              assert manifest["proof"]["sessions"]>=rep["new_match_stats"]
              assert rep["historical_pit_certified"] is False
              assert rep["official_training_allowed"] is False
          if summary["issue_status"]=="OBSERVED_RECHECK":
              iss=list(ISSUE_ROOT.glob("*/run-"+token+"-issues"))
              assert len(iss)==1,"MISSING_ISSUE_EVIDENCE"
              p=iss[0]
              proof=json.loads((p/"ISSUE_RECHECK_REPORT.json").read_text())
              manifest=json.loads((p/"ISSUE_SOURCE.manifest.json").read_text())
              assert hashlib.sha256((p/"ISSUE_SOURCE.enc").read_bytes()).hexdigest()==proof["source_cipher_sha256"]==manifest["ciphertext_sha256"]
              assert proof["original_rows_modified"] is False
              assert proof["official_training_allowed"] is False
              assert proof["xg_reverified"]+proof["yellow_from_events"]<=proof["cumulative_issue_rows"]
              with sqlite3.connect(ISSUE_DB) as db:
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert db.execute("SELECT COUNT(*) FROM issue_rechecks WHERE original_provider_first_published_at_utc IS NOT NULL").fetchone()[0]==0
                  assert db.execute("SELECT COUNT(*) FROM issue_rechecks WHERE scope='ENG'").fetchone()[0]==0
          with sqlite3.connect(DB) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              count=db.execute("SELECT COUNT(*) FROM observations").fetchone()[0]
              assert count==summary["cumulative_match_stats"]
              assert db.execute("SELECT COUNT(*) FROM observations WHERE scope='ENG'").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM finished_fixture_index WHERE scope='ENG'").fetchone()[0]==0
              assert db.execute("SELECT COUNT(*) FROM observations WHERE provider_first_published_at_utc IS NOT NULL").fetchone()[0]==0
          print("KB3_ACCELERATED_REAL_VERIFY",summary["new_match_stats"],count,
                quality["totals"]["pair_xg_5_complete"],summary["issue_status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_HISTORY_PITCHAPI_SEALED_RESEARCH
          path: |
            data/research/historical_multistat/
            data/pit_sidecar/historical_multistat/
            data/pit_sidecar/historical_issue_rechecks/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit immutable private research data only
        run: |
          git config user.name kb3-history-research-bot
          git config user.email kb3-history-research-bot@users.noreply.github.com
          # GitHub rejects single blobs >100 MiB. Persist an immutable compressed
          # SQLite snapshot separately; never silently commit a stale database.
          python - <<'PY'
          import gzip,hashlib,json,os,sqlite3
          from pathlib import Path
          source=Path('data/research/historical_multistat/observations.sqlite')
          if source.exists():
              with sqlite3.connect(source) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              raw=source.read_bytes()
              if len(raw)>=95_000_000:
                  target=source.with_suffix('.sqlite.gz')
                  with gzip.open(target,'wb',compresslevel=6) as out: out.write(raw)
                  assert gzip.decompress(target.read_bytes())==raw
                  assert target.stat().st_size()<95_000_000,'COMPRESSED_SQLITE_TOO_LARGE_NEEDS_CHUNKING'
                  manifest={'schema':'kb3-history-compressed-sqlite-v1','raw_sha256':hashlib.sha256(raw).hexdigest(),'raw_bytes':len(raw),'compressed_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'compressed_bytes':target.stat().st_size()}
                  target.with_suffix('.sqlite.gz.manifest.json').write_text(json.dumps(manifest,sort_keys=True)+'\\n')
                  print('SQLITE_SNAPSHOT_COMPRESSED',manifest)
          PY
          git add -f data/research/historical_multistat/ data/pit_sidecar/historical_multistat/
          if test -f data/research/historical_multistat/observations.sqlite.gz; then
            git rm --cached --ignore-unmatch data/research/historical_multistat/observations.sqlite
            git add -f data/research/historical_multistat/observations.sqlite.gz data/research/historical_multistat/observations.sqlite.gz.manifest.json
          fi
          if test -d data/pit_sidecar/historical_issue_rechecks; then git add -f data/pit_sidecar/historical_issue_rechecks/; fi
          if git diff --cached --quiet; then
            echo 'No new independent PitchAPI source records'
          else
            git commit -m 'research(history): PitchAPI true observed multi-stat and xG source batch, no model changes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
