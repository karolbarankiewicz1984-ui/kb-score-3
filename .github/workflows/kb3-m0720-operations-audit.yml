name: KB3 M0-720 operational audit and full offline regression
on:
  pull_request:
    paths:
      - 'src/kb3_step16_m0_720_*.py'
      - 'src/kb3_step16_run_policy.py'
      - 'scripts/step16_m0_*.py'
      - 'scripts/step16_next_cycle_gate.py'
      - 'scripts/audit_m0720_operations.py'
      - 'scripts/test_m0720_offline.py'
      - 'tests/test_m0720_operations.py'
      - 'tests/test_step16_m0_*.py'
      - 'docs/audits/M0_720_*'
      - '.github/workflows/kb3-step16-m0-720-eight-forward.yml'
      - '.github/workflows/kb3-m0720-operations-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/kb3_step16_m0_720_*.py'
      - 'src/kb3_step16_run_policy.py'
      - 'scripts/audit_m0720_operations.py'
      - 'scripts/test_m0720_offline.py'
      - 'tests/test_m0720_operations.py'
      - '.github/workflows/kb3-m0720-operations-audit.yml'
permissions:
  contents: read
jobs:
  audit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'catboost==1.2.8' 'cryptography>=42,<47' 'pitchapi==0.1.6'
      - name: Restore SHA-verified historical SQLite before read-only full regression
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          folder=Path('data/research/historical_multistat')
          source=folder/'observations.sqlite.gz'
          manifest=folder/'observations.sqlite.gz.manifest.json'
          target=folder/'observations.sqlite'
          assert source.is_file() and manifest.is_file(), 'HISTORICAL_ARCHIVE_NOT_FOUND_FAIL_CLOSED'
          m=json.loads(manifest.read_text())
          raw=gzip.decompress(source.read_bytes())
          assert hashlib.sha256(raw).hexdigest()==m['raw_sha256'], 'HISTORICAL_ARCHIVE_SHA_MISMATCH'
          target.write_bytes(raw)
          print('HISTORICAL_RESEARCH_DB_VERIFIED_READ_ONLY_TEST_INPUT',len(raw))
          PY
      - name: All unique regressions; no provider calls, real-data fit or protected writes
        run: python scripts/test_m0720_offline.py > m0720-regression.log 2>&1
      - name: Checkout immutable historic source (private repo, no persistent credentials)
        uses: actions/checkout@v4
        with:
          ref: ad59f8cc3bceb26fea97c937be825d3ee6cde3e6
          path: kb3-pinned-audit
          persist-credentials: false
          sparse-checkout: |
            data/forward_m0_720_eight
            data/pit_sidecar/m0_720_eight
            data/pit_sidecar/step17_native_xg_eight
      - name: Recompute committed real audit on its exact read-only snapshot
        run: |
          # The 2026-11-04 07:11 UTC audit is immutable and refers to
          # a pre-14:43 snapshot with 91 freeze rows. Current main already
          # has 126 forecasts: never compare the old report with live DB.
          SNAPSHOT="$GITHUB_WORKSPACE/kb3-pinned-audit"
          test -f "$SNAPSHOT/data/forward_m0_720_eight/kb3_forward_eight.sqlite"
          # Historical Git snapshot did not include the PR-only immutable
          # GitHub workflow evidence file; restore only that read-only report.
          mkdir -p "$SNAPSHOT/docs/audits"
          cp docs/audits/M0_720_ACTIONS_OBSERVED_2026-11-04.json "$SNAPSHOT/docs/audits/"
          python -m scripts.audit_m0720_operations \
            --db "$SNAPSHOT/data/forward_m0_720_eight/kb3_forward_eight.sqlite" \
            --root "$SNAPSHOT" \
            --verify-report docs/audits/M0_720_OPERATIONS_2026-11-04.json \
            --historical-horizon-hours 96
          git diff --exit-code -- data models config
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_M0720_OPERATIONAL_REGRESSION_${{ github.run_id }}_${{ github.run_attempt }}
          path: m0720-regression.log
          if-no-files-found: error
