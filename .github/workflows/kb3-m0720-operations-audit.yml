name: KB3 M0-720 operational audit and full offline regression
on:
  pull_request:
    paths:
      - 'src/kb3_step16_m0_720_*.py'
      - 'src/kb3_step16_run_policy.py'
      - 'scripts/step16_m0_*.py'
      - 'scripts/step16_next_cycle_gate.py'
      - 'scripts/audit_m0720_operations.py'
      - 'scripts/test_m0720_offline.py'
      - 'tests/test_m0720_operations.py'
      - 'tests/test_step16_m0_*.py'
      - 'docs/audits/M0_720_*'
      - '.github/workflows/kb3-step16-m0-720-eight-forward.yml'
      - '.github/workflows/kb3-m0720-operations-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/kb3_step16_m0_720_*.py'
      - 'src/kb3_step16_run_policy.py'
      - 'scripts/audit_m0720_operations.py'
      - 'scripts/test_m0720_offline.py'
      - 'tests/test_m0720_operations.py'
      - '.github/workflows/kb3-m0720-operations-audit.yml'
permissions:
  contents: read
jobs:
  audit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'catboost==1.2.8' 'cryptography>=42,<47' 'pitchapi==0.1.6'
      - name: All unique regressions; no provider calls, real-data fit or protected writes
        run: python scripts/test_m0720_offline.py > m0720-regression.log 2>&1
      - name: Recompute committed real audit on its exact read-only snapshot
        run: |
          python -m scripts.audit_m0720_operations \
            --verify-report docs/audits/M0_720_OPERATIONS_2026-11-04.json
          git diff --exit-code -- data models config
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_M0720_OPERATIONAL_REGRESSION_${{ github.run_id }}_${{ github.run_attempt }}
          path: m0720-regression.log
          if-no-files-found: error
