name: KB3 Step14 M1-R BASE real CatBoost 720 TRAIN 374 VAL against M0
on:
  pull_request:
    paths:
      - 'scripts/step14_m1r_train_real_catboost_720_evaluate_374.py'
      - 'tests/test_step14_m1r_train_catboost_720_eval_374.py'
      - '.github/workflows/kb3-step14-m1r-catboost720-eval374.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/step14_m1r_train_real_catboost_720_evaluate_374.py'
      - '.github/workflows/kb3-step14-m1r-catboost720-eval374.yml'
  workflow_dispatch:
    inputs:
      confirm_research_fit:
        type: boolean
        default: false
        required: true
        description: Explicitly authorize a separate research fit (never changes M0)
permissions:
  contents: read
concurrency:
  group: kb3-m1r-base-fit-720-eval-374
  cancel-in-progress: false
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m unittest discover -s tests -p 'test_step14_m1r*.py' -v
  independent-research-m1r-catboost:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_research_fit == true
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CatBoost and existing authorized PitchAPI SDK
        run: |
          python -m pip install --disable-pip-version-check "catboost==1.2.8" "pitchapi==0.1.6"
      - name: Strict anti-leakage, M1-R 1140 and metric correctness unit tests
        run: |
          python -m compileall -q scripts/step14_m1r_train_real_catboost_720_evaluate_374.py
          python -m unittest discover -s tests -p 'test_step14_m1r_train_catboost_720_eval_374.py' -v
          python -m unittest discover -s tests -p 'test_step14_m1r_relaxed_1140.py' -v
      - name: Allocate unique append-only experiment output
        run: echo "OUTPUT_DIR=${RUNNER_TEMP}/m1r-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Train separate real CatBoost M1-R 720 and evaluate 374 vs two M0 baselines
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m scripts.step14_m1r_train_real_catboost_720_evaluate_374 \
            --summary ${{ env.OUTPUT_DIR }}/METRICS.json \
            --predictions ${{ env.OUTPUT_DIR }}/FROZEN_PROBS.jsonl.gz \
            --model ${{ env.OUTPUT_DIR }}/MODEL.cbm
      - name: Verify immutability and hard 760 TRAIN / 380 VAL / TEST quarantine
        run: |
          python - <<'PY'
          import gzip,hashlib,json,math,os
          from pathlib import Path
          p=Path(os.environ['OUTPUT_DIR'])
          s=json.loads((p/'METRICS.json').read_text())
          probs=p/'FROZEN_PROBS.jsonl.gz'
          model=p/'MODEL.cbm'
          assert s['training']==720 and s['validation']==374
          assert s['all_1140_source_rows_matched']==1140
          assert s['real_PitchAPI_API_calls']==4
          assert s['original_GATE14']=='PENDING'
          assert s['original_TEST_2026_27_never_requested']
          assert s['feature_selection_based_only_on_TRAIN_720']
          assert s['all_OPTIONAL_xg_and_source_overlay_excluded']
          assert s['validation_evaluation_once_no_early_stopping']
          assert s['predictions_sha256']==hashlib.sha256(probs.read_bytes()).hexdigest()
          assert s['trained_model_sha256']==hashlib.sha256(model.read_bytes()).hexdigest()
          with gzip.open(probs,'rt',encoding='utf8') as f:
              entries=[json.loads(x) for x in f if x.strip()]
          assert len(entries)==374
          assert len({x['fixture_id'] for x in entries})==374
          assert all(x['partition']=='VALIDATION' and
             abs(sum(x['catboost_m1r_base_1x2'].values())-1)<1e-8 for x in entries)
          assert all('label' not in x and 'score' not in x
                     for row in entries for x in [dict(row)])
          for k in ('catboost_m1r_base_validation',
                    'm0_matched_720_train_reference_poisson_validation',
                    'm0_original_760_train_frozen_reference_validation'):
              m=s[k]
              assert m['n']==374
              assert all(math.isfinite(m[j]) for j in
                   ('log_loss','brier_multiclass_sum3','top1_ece_5_bins','top1_accuracy'))
              assert len(m['per_class_reliability_5_bins'])==3
          print('SUCCESS M1R CATBOOST',s['catboost_m1r_base_validation']['log_loss'],
                'M0 same-720',s['m0_matched_720_train_reference_poisson_validation']['log_loss'],
                'Brier',s['catboost_m1r_base_validation']['brier_multiclass_sum3'],
                s['m0_matched_720_train_reference_poisson_validation']['brier_multiclass_sum3'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KB3_M1R_RESEARCH_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_DIR }}/METRICS.json
            ${{ env.OUTPUT_DIR }}/FROZEN_PROBS.jsonl.gz
            ${{ env.OUTPUT_DIR }}/MODEL.cbm
          retention-days: 90
          if-no-files-found: error
