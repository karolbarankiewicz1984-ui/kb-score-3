name: "KB3 Step13 - ONE TIME Free PitchAPI Real Retrospective Research"
on:
  push:
    branches: ["feature/step13-pitchapi-live-retrospective-once-20261027"]
    paths:
      - ".github/workflows/kb3-step13-pitchapi-research-once.yml"
permissions:
  contents: read
concurrency:
  group: kb3-step13-pitchapi-live-once-20261027
  cancel-in-progress: false
jobs:
  one-time-aggregate-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install existing free PitchAPI SDK
        run: python3 -m pip install --disable-pip-version-check "pitchapi==0.1.6"
      - name: Offline synthetic source guard tests BEFORE any API requests
        run: |
          python3 -m unittest discover -s tests -p 'test_step13_pitchapi_live_research.py' -v
          python3 -m unittest discover -s tests -p 'test_step13_retrospective.py' -v
      - name: One PitchAPI historical read per completed PL season; aggregate-only metrics
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PITCHAPI_API_KEY" ]; then
            echo "KB3_STEP13_NO_PROVIDER_SECRET; NO NETWORK CALLS"
            exit 3
          fi
          python3 -m scripts.step13_pitchapi_research_once \
            --output audit/step13/STEP13_REAL_RETROSPECTIVE_PITCHAPI_2026-10-27.json
      - name: Confirm 4 folds, 380 real validation rows, no PIT or TEST promises
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.kb3_split import sha
          p=Path("audit/step13/STEP13_REAL_RETROSPECTIVE_PITCHAPI_2026-10-27.json")
          x=json.loads(p.read_text(encoding="utf8"))
          assert x["report_sha256"]==sha({k:v for k,v in x.items() if k!="report_sha256"})
          assert x["provider"]=="PitchAPI"
          assert x["provider_requests_exactly"]==3
          assert x["train_partition_rows"]==760
          assert x["validation_partition_rows"]==380
          assert x["test_rows_processed"]==0
          assert [f["validation_count"] for f in x["folds"]]==[60,126,123,71]
          assert all(x["overall"][m]["validation_n"]==380 for m in (
              "EXPANDING","ROLLING_24_CALENDAR_MONTHS"))
          assert x["source_category"]=="REAL_PROVIDER_RETRIEVED_NOW_RETROSPECTIVE_EVENTTIME_ONLY"
          assert not x["test_partition_data_requested"]
          assert not x["source_scores_in_report"]
          assert not x["training_allowed"] and not x["gate13_pass"]
          assert not x["historical_pit_backtest_performed"]
          assert not x["model_production_eligible"]
          print("KB3_STEP13_REAL_AGGREGATE_RETROSPECTIVE_ONLY_PASS")
          PY
      - name: Upload aggregate report only (no provider responses, match scores, RSA or API key)
        uses: actions/upload-artifact@v4
        with:
          name: kb3-step13-pitchapi-retrospective-aggregate-20261027
          path: audit/step13/STEP13_REAL_RETROSPECTIVE_PITCHAPI_2026-10-27.json
          retention-days: 90
          if-no-files-found: error
