name: "KB3 Step11 - One-Time xG Identity Review"
on:
  push:
    branches: ["feature/step11-xg-identity-audit-20261026"]
    paths: [".github/workflows/kb3-step11-xg-identity-once.yml"]
permissions:
  contents: read
concurrency:
  group: kb3-step11-xg-identity-once-20261026
  cancel-in-progress: false
jobs:
  limited-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and crypto
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Offline identity tests first
        run: |
          python -m unittest discover -s tests -p 'test_step11_identity_review.py' -v
          python -m unittest discover -s tests -p 'test_step11_second_pit_xg.py' -v
      - name: One current-season observation and three PitchAPI shot feeds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" && test -n "$PITCHAPI_API_KEY"
          python -m scripts.step11_second_live_capture \
            --outdir audit/step11/xg-identity-v2 \
            --public-key config/step11_archive_recipient_public.pem
      - name: Validate review-only results, no publication claim
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('audit/step11/xg-identity-v2')
          a=json.loads((d/'STEP11_SECOND_PIT_SANITIZED.json').read_text())
          b=json.loads((d/'KB3_PL_2026-27_SECOND_PIT_AND_XG.manifest.json').read_text())
          assert a['schema']=='kb3-step11-second-pit-plus-xg-v2'
          assert a['fixture_records']==380 and a['api_football_calls']==1
          assert a['pitchapi_calls']<=6 and a['sample_selected']==3
          assert sum(a['xg_match_review_reason_counts'].values())==3
          assert a['match_source_metadata_in_sealed_archive'] is True
          assert a['aliases_auto_approved']==0
          assert a['xg_audit']==b['xg_evidence']
          assert not a['training_allowed'] and not b['training_allowed']
          assert not a['offsite_restore_verified']
          assert not (d/'EPHEMERAL_TWO_SOURCE_PIT.sqlite3').exists()
          print('KB3_XG_IDENTITY_QUARANTINE_AUDIT_PASS')
          PY
      - name: Upload ciphertext and aggregate only
        uses: actions/upload-artifact@v4
        with:
          name: kb3-step11-xg-identity-review-20261026
          path: |
            audit/step11/xg-identity-v2/KB3_PL_2026-27_SECOND_PIT_AND_XG.enc
            audit/step11/xg-identity-v2/KB3_PL_2026-27_SECOND_PIT_AND_XG.manifest.json
            audit/step11/xg-identity-v2/STEP11_SECOND_PIT_SANITIZED.json
          retention-days: 30
          if-no-files-found: error
