name: KB3 Step14 1140 original native matched to nine real old public PIT sources

on:
  push:
    branches: [step14/full-historical-2023-2026-source-lineage-20261028, main]
    paths:
      - 'scripts/step14_full_1140_native_public_pit_lineage.py'
      - 'tests/test_step14_full_1140_native_public_pit_lineage.py'
      - '.github/workflows/kb3-step14-full-1140-historic-native-lineage.yml'
  pull_request:
    paths:
      - 'scripts/step14_full_1140_native_public_pit_lineage.py'
      - 'tests/test_step14_full_1140_native_public_pit_lineage.py'
      - '.github/workflows/kb3-step14-full-1140-historic-native-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-native-published-historical-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no current protected historical results, reject fake GHArchive and changed source identity
        run: |
          python -m compileall -q scripts/step14_full_1140_native_public_pit_lineage.py
          python -m unittest discover -s tests -p 'test_step14_full_1140_native_public_pit_lineage.py' -v
      - name: Install existing PitchAPI SDK, no second key or private RSA
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6'
      - name: Full 760 TRAIN and 380 VALIDATION exact native ID + old public source PIT check
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python -m scripts.step14_full_1140_native_public_pit_lineage --report "$RUNNER_TEMP/KB3_HISTORICAL_1140_LINEAGE_SUMMARY.json" --rows "$RUNNER_TEMP/KB3_HISTORICAL_1140_NATIVE_PIT_PER_MATCH.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_STEP14_FULL_1140_NATIVE_MATCH_HISTORICAL_PUBLIC_SOURCE_LINEAGE
          path: |
            ${{ runner.temp }}/KB3_HISTORICAL_1140_LINEAGE_SUMMARY.json
            ${{ runner.temp }}/KB3_HISTORICAL_1140_NATIVE_PIT_PER_MATCH.jsonl
          retention-days: 90
          if-no-files-found: warn
