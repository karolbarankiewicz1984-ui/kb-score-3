name: KB3 Step14 1140 original native matched to thirteen independently published old public PIT sources

on:
  push:
    branches: [step14/full-historical-2023-2026-source-lineage-20261028, main]
    paths:
      - 'scripts/step14_full_1140_native_public_pit_lineage.py'
      - 'tests/test_step14_full_1140_native_public_pit_lineage.py'
      - '.github/workflows/kb3-step14-full-1140-historic-native-lineage.yml'
  pull_request:
    paths:
      - 'scripts/step14_full_1140_native_public_pit_lineage.py'
      - 'tests/test_step14_full_1140_native_public_pit_lineage.py'
      - '.github/workflows/kb3-step14-full-1140-historic-native-lineage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-native-published-historical-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no current protected historical results, reject fake GHArchive and changed source identity
        run: |
          python -m compileall -q scripts/step14_full_1140_native_public_pit_lineage.py
          python -m unittest discover -s tests -p 'test_step14_full_1140_native_public_pit_lineage.py' -v
      - name: Install existing PitchAPI SDK, no second key or private RSA
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6'
      - name: Full 760 TRAIN and 380 VALIDATION exact native ID + old public source PIT check
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python -m scripts.step14_full_1140_native_public_pit_lineage --report "$RUNNER_TEMP/KB3_HISTORICAL_1140_LINEAGE_SUMMARY.json" --rows "$RUNNER_TEMP/KB3_HISTORICAL_1140_NATIVE_PIT_PER_MATCH.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_STEP14_FULL_1140_NATIVE_MATCH_HISTORICAL_PUBLIC_SOURCE_LINEAGE
          path: |
            ${{ runner.temp }}/KB3_HISTORICAL_1140_LINEAGE_SUMMARY.json
            ${{ runner.temp }}/KB3_HISTORICAL_1140_NATIVE_PIT_PER_MATCH.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Persist entire original 1140-row historical source lineage immutably on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp') if False else Path(__import__('os').environ['RUNNER_TEMP'])
          summary=json.loads((src/'KB3_HISTORICAL_1140_LINEAGE_SUMMARY.json').read_text())
          rows=(src/'KB3_HISTORICAL_1140_NATIVE_PIT_PER_MATCH.jsonl').read_text().splitlines()
          assert summary['original_exact_native_ID_and_kickoff_joins']==1140
          assert summary['train']==760 and summary['validation']==380
          assert summary['both_teams_form5_source_available']==106
          assert summary['historical_sources_checked']==13
          assert summary['original_train_certified_PIT']==0
          assert summary['original_validation_certified_PIT']==0
          assert not summary['original_CatBoost_M1_fit_allowed']
          assert not summary['test_examined'] and not summary['target_result_scores_accessed']
          assert len(rows)==1140 and len({json.loads(row)['fixture_id'] for row in rows})==1140
          assert all(not json.loads(row)['original_121_plus_38_PIT_training_eligible'] for row in rows)
          folder=Path('data/audits')
          dests=(folder/'STEP14_1140_EXACT_NATIVE_PUBLIC_SOURCE_PIT_SUMMARY_2026-10-28.json',
                 folder/'STEP14_1140_EXACT_NATIVE_PUBLIC_SOURCE_PIT_PER_MATCH_2026-10-28.jsonl')
          if any(p.exists() for p in dests):
              assert all(p.exists() for p in dests), 'PARTIAL_APPEND_ONLY_ARCHIVE'
              assert json.loads(dests[0].read_text())['original_exact_native_ID_and_kickoff_joins']==1140
              assert len(dests[1].read_text().splitlines())==1140
              print('EXISTING_IMMUTABLE_FULL_1140_ARCHIVE_ALREADY_PRESENT')
          else:
              dests[0].write_text(json.dumps(summary,indent=2,sort_keys=True,ensure_ascii=False)+'\\n')
              dests[1].write_text('\\n'.join(rows)+'\\n')
              print('PERSISTENT_FULL_1140_SOURCE_LINEAGE_PREPARED')
          PY
          git config user.name 'kb3-historic-lineage-bot'
          git config user.email 'kb3-historic-lineage-bot@users.noreply.github.com'
          git add data/audits/STEP14_1140_EXACT_NATIVE_PUBLIC_SOURCE_PIT_*
          if git diff --cached --quiet; then
            echo 'No new append-only historical provenance snapshot.'
          else
            git commit -m 'audit: freeze exact 1140 historical native-public per-fixture provenance'
            git push origin HEAD:main
          fi
