name: KB3 Step14 all 74 old FPL fixture revisions and old player xG
on:
  pull_request:
    paths:
      - 'scripts/step14_inventory_all_74_historic_fpl_revisions_xg.py'
      - 'tests/test_step14_all74_fpl_historic_xg.py'
      - '.github/workflows/kb3-step14-all74-fpl-old-xg.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/step14_inventory_all_74_historic_fpl_revisions_xg.py'
      - '.github/workflows/kb3-step14-all74-fpl-old-xg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-real-74-archived-2023-2025-fpl-and-alternative-player-xg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No lookahead, player xg duplicate and numeric tests
        run: |
          python -m unittest discover -s tests -p 'test_step14_all74_fpl_historic_xg.py' -v
          python -m unittest discover -s tests -p 'test_step14_760_decimal_FPL_FT_corrected_v2.py' -v
      - name: LIVE inventory of 38 plus 36 immutable commit revisions and old merged_gw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.step14_inventory_all_74_historic_fpl_revisions_xg \
            --out data/audits/STEP14_ALL_74_2023_2025_FPL_REVISIONS_PLAYER_XG_2026-10-29.json
      - name: Enforce complete 74, exact GitHub SHA and original M1 isolation
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/audits/STEP14_ALL_74_2023_2025_FPL_REVISIONS_PLAYER_XG_2026-10-29.json'))
          assert r['exact_revisions_pinned']==74
          assert r['revision_counts_by_season']=={'2023-24':38,'2024-25':36}
          assert len(r['revisions'])==74
          assert r['previously_direct_GHArchive_clock_certified_FPL_commits']==11
          assert r['other_revisions_proven_public_no_later_than_GHArchive_witnessed_ancestor']==63
          assert r['all_74_GHArchive_ancestry_upper_bounds_verified']
          assert r['no_original_catboost_training']
          assert r['GATE14']=='PENDING' and not r['TEST_2026_27_accessed']
          assert r['raw_old_player_xg_merged_files_available']>0
          print('REAL_74_FPL_XG_AUDIT',r['raw_old_player_xg_merged_files_available'],
                'old merged files',r['old_player_xg_strict_sources_with_historic_upper_bound_witness'],
                'independently dated xG sources, not PitchAPI native')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KB3_STEP14_ALL74_FPL_HISTORICAL_REVISION_XG_INVENTORY
          path: data/audits/STEP14_ALL_74_2023_2025_FPL_REVISIONS_PLAYER_XG_2026-10-29.json
          retention-days: 90
          if-no-files-found: error
      - name: Persist old-sha-player-xg audit after successful main run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name kb3-step14-audit-bot
          git config user.email kb3-step14-audit-bot@users.noreply.github.com
          git add -f data/audits/STEP14_ALL_74_2023_2025_FPL_REVISIONS_PLAYER_XG_2026-10-29.json
          if ! git diff --cached --quiet; then
            git commit -m 'step14: preserve all 74 historical FPL revision and old-player-xg audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
