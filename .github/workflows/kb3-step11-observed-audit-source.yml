name: "KB3 Step11 - Export Offline Observed Feature Source"
on:
  push:
    branches: ["feature/step11-observed-feature-builder-20261026"]
    paths: [".github/workflows/kb3-step11-observed-audit-source.yml"]
permissions:
  contents: read
jobs:
  offline-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run focused observed-asof tests
        run: python -m unittest discover -s tests -p 'test_step11_observed_features.py' -v
      - name: Export source code and public match evidence ONLY
        uses: actions/upload-artifact@v4
        with:
          name: kb3-step11-observed-source-20261026
          retention-days: 3
          if-no-files-found: error
          path: |
            src/kb3_features.py
            src/kb3_observed_features.py
            src/kb3_pit_ledger.py
            src/kb3_xg_pit.py
            src/kb3_reviewed_xg.py
            src/kb3_identity_review.py
            scripts/step11_observed_features_audit.py
            scripts/pitchapi_step06_audit.py
            config/step11_reviewed_pitch_fixture_crosswalk_20261026.json
