name: "KB3 Step 13 - Train-Only Poisson Fit Safety"
on:
  push:
    branches: ["feature/step13-poisson-train-policy-v03", "main"]
    paths:
      - "src/kb3_step13_poisson_train.py"
      - "src/kb3_step13_poisson_fit_report.py"
      - "tests/test_step13_poisson_train.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-poisson-train.yml"
  pull_request:
    paths:
      - "src/kb3_step13_poisson_train.py"
      - "src/kb3_step13_poisson_fit_report.py"
      - "tests/test_step13_poisson_train.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-poisson-train.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-only-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run independent Poisson TRAIN isolation tests
        run: |
          python3 -m unittest discover -s tests -p 'test_step13*.py' -v
          python3 -m unittest discover -s tests -p 'test_step12_acceptance.py' -v
      - name: Freeze and verify synthetic parameter fit reference
        run: |
          python3 -m src.kb3_step13_poisson_fit_report \
            --output data/audits/STEP13_SYNTHETIC_POISSON_FIT_V03_2026-10-26.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.kb3_split import sha
          from src.kb3_step13_poisson_fit_report import generate
          p=Path('data/audits/STEP13_SYNTHETIC_POISSON_FIT_V03_2026-10-26.json')
          r=json.loads(p.read_text())
          assert r["report_sha256"]==sha({k:v for k,v in r.items() if k!="report_sha256"})
          assert r==generate(Path.cwd()), 'non deterministic report'
          assert r["frozen_candidate"]["synthetic_train_n"]==12
          assert r["real_step12_schedule_total"]==1520
          assert r["real_pit_eligible_training_count"]==0
          assert r["real_fitted_matches"]==0
          assert not r["training_allowed"] and not r["gate13_pass"]
          assert not r["historical_m0_brier_available"]
          assert not r["historical_m0_logloss_available"]
          assert not r["parameter_candidate_for_production"]
          print("STEP13_TRAIN_ONLY_MLE_SYNTHETIC_PASS_REAL_HISTORICAL_GATE_BLOCKED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kb3-step13-train-only-poisson-v03-reference
          path: data/audits/STEP13_SYNTHETIC_POISSON_FIT_V03_2026-10-26.json
          if-no-files-found: error
          retention-days: 90
