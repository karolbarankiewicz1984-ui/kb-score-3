name: KB3 M0 real 1X2 settlement, Brier, log loss and future 100x50 calibration
on:
  push:
    branches: [main]
    paths:
      - src/kb3_m0_shadow_daily_settlement.py
      - migrations/004_m0_shadow_settlement_and_future_calibration.sql
      - tests/test_step14_m0_shadow_settlement_calibration.py
      - .github/workflows/kb3-m0-shadow-daily-settlement.yml
  pull_request:
    paths:
      - src/kb3_m0_shadow_daily_settlement.py
      - migrations/004_m0_shadow_settlement_and_future_calibration.sql
      - tests/test_step14_m0_shadow_settlement_calibration.py
      - .github/workflows/kb3-m0-shadow-daily-settlement.yml
  schedule:
    - cron: '03 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kb3-three-league-daily-pit-capture
  cancel-in-progress: false
jobs:
  test-outcome-calibration-math:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing shared evidence RSA dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Run strict result and 100+50 future calibration tests
        run: |
          python -m compileall -q src/kb3_m0_shadow_daily_settlement.py
          python -m unittest discover -s tests -p 'test_step14_m0_shadow_settlement_calibration.py' -v
          python -m unittest discover -s tests -p 'test_step14_m0_shadow_1x2_live_freeze.py' -v
  actual-real-pitchapi-postmatch-settlement:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-outcome-calibration-math
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EXISTING SDK and public RSA archive dependency
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Fetch 3 real league seasons, seal raw results, settle ended M0 1X2 only
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m src.kb3_m0_shadow_daily_settlement \
            --db data/forward_m0/kb3_forward_m0.sqlite \
            --base data/settlements/m0_shadow_daily \
            --public-key config/step11_archive_recipient_public.pem
      - name: Verify original immutable 1X2, SHA-linked outcome sources, log loss and Brier
        run: |
          python - <<'PY'
          import datetime,sqlite3,json,hashlib,math
          from pathlib import Path
          from src.kb3_step14_m1_math_calibration import score_one
          day=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          folder=Path('data/settlements/m0_shadow_daily')/day
          audit=json.loads((folder/'M0_DAILY_SETTLEMENT_AUDIT.json').read_text())
          manifest=json.loads((folder/'M0_RESULTS_ORIGINAL_PITCHAPI.manifest.json').read_text())
          cipher=(folder/'M0_RESULTS_ORIGINAL_PITCHAPI.enc').read_bytes()
          dbpath=Path('data/forward_m0/kb3_forward_m0.sqlite')
          assert hashlib.sha256(cipher).hexdigest()==manifest['ciphertext_sha256']==audit['ciphertext_sha256']
          assert hashlib.sha256(dbpath.read_bytes()).hexdigest()==audit['sqlite_sha256']
          assert audit['source_requests']==4
          assert audit['min_calibration_sample']==100 and audit['min_later_unseen_sample']==50
          assert not audit['future_calibration_auto_activation']
          assert audit['original_Premier_League_2026_27_TEST_not_queried']
          assert audit['original_M1_gate14_pass'] is False
          with sqlite3.connect(dbpath) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
              assert db.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]==0
              count=db.execute('SELECT COUNT(*) FROM m0_shadow_1x2_settlements').fetchone()[0]
              assert count==audit['cumulative_settled_1x2']
              assert db.execute('SELECT COUNT(*) FROM m0_shadow_calibration_evaluations WHERE automatic_activation!=0').fetchone()[0]==0
              rows=db.execute("""SELECT p.p_1,p.p_x,p.p_2,s.result_1x2,s.log_loss,
                s.brier_sum3 FROM m0_shadow_1x2_settlements s JOIN
                m0_shadow_1x2_forecasts p ON p.forecast_id=s.forecast_id""").fetchall()
              for h,d,a,label,ll,bs in rows:
                  expect_ll,expect_bs=score_one({'1':h,'X':d,'2':a},label)
                  assert math.isclose(ll,expect_ll,abs_tol=1e-12)
                  assert math.isclose(bs,expect_bs,abs_tol=1e-12)
          print('M0_REAL_SETTLEMENT_LEDGER_AND_LOGLOSS_BRIER_VERIFIED',count,
                'new',audit['newly_settled_1x2'],'calibration_candidates',audit['calibration_candidates_total'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_M0_REAL_POSTMATCH_BRIER_LOGLOSS_SOURCE_AND_SQLITE
          path: |
            data/forward_m0/kb3_forward_m0.sqlite
            data/settlements/m0_shadow_daily/
          retention-days: 30
          if-no-files-found: warn
      - name: Append SHA-proven real results and SQLite to private main
        run: |
          git config user.name "kb3-settlement-bot"
          git config user.email "kb3-settlement-bot@users.noreply.github.com"
          git add -f data/forward_m0/kb3_forward_m0.sqlite
          git add -f data/settlements/m0_shadow_daily/*/M0_DAILY_SETTLEMENT_AUDIT.json
          git add -f data/settlements/m0_shadow_daily/*/M0_RESULTS_ORIGINAL_PITCHAPI.manifest.json
          git add -f data/settlements/m0_shadow_daily/*/M0_RESULTS_ORIGINAL_PITCHAPI.enc
          if git diff --cached --quiet; then
            echo 'Already archived daily outcome evidence.'
          else
            git commit -m 'm0: real 1X2 postmatch settlements log loss Brier and future calibration monitoring'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
