# LEGACY worker retired 2026-10-29: the authoritative live settlement,
# encrypted original PitchAPI evidence and immutable 100+50 calibration gate
# run in kb3-m0-real-postmatch-calibration.yml, at 07:47 and 22:47 UTC.
# Keep regression tests for old code, but NEVER start two settlement writers.
name: KB3 M0 legacy settlement regression only (live writer retired)
on:
  pull_request:
    paths:
      - src/kb3_m0_shadow_settlement.py
      - migrations/004_m0_shadow_settlement_calibration.sql
      - tests/test_step14_m0_shadow_settlement.py
      - .github/workflows/kb3-m0-shadow-daily-settlement.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/kb3-m0-shadow-daily-settlement.yml
permissions:
  contents: read
jobs:
  legacy-regression-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests only - no PitchAPI, no settlements, no writes
        run: |
          python -m compileall -q src/kb3_m0_shadow_settlement.py
          python -m unittest discover -s tests -p 'test_step14_m0_shadow_settlement.py' -v
