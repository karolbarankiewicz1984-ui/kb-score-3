name: KB3 Step17 historical xG5 CatBoost ablation (research only)
on:
  pull_request:
    paths:
      - scripts/step17_xg5_research_ablation.py
      - tests/test_step17_xg5_research_ablation.py
      - .github/workflows/kb3-step17-xg5-chrono-research.yml
  push:
    branches: [main]
    paths:
      - scripts/step17_xg5_research_ablation.py
      - tests/test_step17_xg5_research_ablation.py
      - .github/workflows/kb3-step17-xg5-chrono-research.yml
  schedule:
    - cron: '45 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kb3-step17-xg5-research-only
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline exact-last5, source provenance and chronology tests
        run: |
          python -m compileall -q scripts/step17_xg5_research_ablation.py tests/test_step17_xg5_research_ablation.py
          python -m unittest discover -s tests -p 'test_step17_xg5_research_ablation.py' -v
  real-research:
    needs: safety
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore SHA256-verified archived historical SQLite (read-only source)
        run: |
          python - <<'PY'
          import gzip, hashlib, json, sqlite3
          from pathlib import Path
          root = Path('data/research/historical_multistat')
          archive = root / 'observations.sqlite.gz'
          manifest_path = root / 'observations.sqlite.gz.manifest.json'
          assert archive.is_file() and manifest_path.is_file(), 'HISTORICAL_ARCHIVE_OR_MANIFEST_MISSING'
          manifest = json.loads(manifest_path.read_text())
          zipped = archive.read_bytes()
          assert len(zipped) == manifest['compressed_bytes']
          assert hashlib.sha256(zipped).hexdigest() == manifest['compressed_sha256']
          raw = gzip.decompress(zipped)
          assert len(raw) == manifest['raw_bytes']
          assert hashlib.sha256(raw).hexdigest() == manifest['raw_sha256']
          db_path = root / 'observations.sqlite'
          db_path.write_bytes(raw)
          with sqlite3.connect('file:' + str(db_path.resolve()) + '?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert db.execute('SELECT COUNT(*) FROM observations WHERE scope=\'ENG\'').fetchone()[0] == 0
          print('KB3_VERIFIED_HISTORICAL_SQLITE_RESTORED', len(raw))
          PY
      - name: Install isolated CatBoost, no provider API required
        run: python -m pip install --disable-pip-version-check 'catboost==1.2.8'
      - name: Train older, evaluate later (unchanged historical observations)
        run: |
          set -euo pipefail
          mkdir -p data/audits/step17_xg5_ablation
          python -m scripts.step17_xg5_research_ablation --out \
            "data/audits/step17_xg5_ablation/STEP17_XG5_ABLATION_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
      - name: Independent source and safeguards verification
        run: |
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          from scripts.step17_xg5_research_ablation import REPORT_SCHEMA
          db=Path("data/research/historical_multistat/observations.sqlite")
          assert db.is_file(),"SOURCE_DATABASE_MISSING"
          p=Path("data/audits/step17_xg5_ablation")/(
              "STEP17_XG5_ABLATION_"+os.environ["GITHUB_RUN_ID"]+"_"+
              os.environ["GITHUB_RUN_ATTEMPT"]+".json")
          r=json.loads(p.read_text())
          assert r["schema"]==REPORT_SCHEMA
          assert r["historical_original_pit_certified"] is False
          assert r["protected_2026_27_premier_league_test_accessed"] is False
          assert r["model_m0_unchanged"] is True
          assert r["calibration_100_fit_50_holdout_unchanged"] is True
          assert r["champion_promotion_authorized"] is False
          assert r["gates_16_17"]=="PENDING"
          assert r["source"]["source_sqlite_sha256"]==hashlib.sha256(db.read_bytes()).hexdigest()
          with sqlite3.connect(db) as d:
              assert d.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert d.execute("SELECT COUNT(*) FROM rolling_feature_cache").fetchone()[0]==r["source"]["research_targets"]
              assert d.execute("SELECT COUNT(*) FROM rolling_feature_cache WHERE scope='ENG'").fetchone()[0]==0
          if r["research_fit_status"]=="EXECUTED_RESEARCH_ABLATION":
              assert r["train_n"]>=80 and r["validation_n"]>=25
              assert r["train_last_kickoff_utc"]<r["validation_first_kickoff_utc"]
              no=r["paired_results"]["NO_XG_FORM_AND_CORE5"]["metrics"]
              yes=r["paired_results"]["WITH_NATIVE_XG5_FORM_AND_CORE5"]["metrics"]
              assert no["n"]==yes["n"]==r["validation_n"]
          else:
              assert r["research_fit_status"]=="NO_GO"
          print("KB3_REAL_XG5_ABLATION_PASS",r["research_fit_status"],r["train_n"],r["validation_n"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb3-xg5-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/audits/step17_xg5_ablation/STEP17_XG5_ABLATION_${{ github.run_id }}_${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 60
      - name: Archive non-sensitive aggregate report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "data/audits/step17_xg5_ablation/STEP17_XG5_ABLATION_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          git commit -m "data(kb3): research-only xG5 ablation run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 3
          done
          exit 3
