name: KB3 CatBoost v3 hosted native-data preflight - 3 leagues (NO provider API)

on:
  pull_request:
    paths:
      - scripts/kb3_catboost_v3_three_league_archive_preflight.py
      - tests/test_kb3_catboost_v3_three_league_archive_preflight.py
      - .github/workflows/kb3-catboost-v3-three-league-evidence.yml
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * *'

permissions:
  contents: read

jobs:
  verify-latest-actual-three-league-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety tests - synthetic source fixtures
        run: |
          python -m unittest discover -s tests -p 'test_kb3_catboost_v3_three_league_archive_preflight.py' -v
      - name: Select most recent independently hosted existing archive
        if: github.event_name != 'pull_request'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=KB3_3_LEAGUE_DAILY_REAL_PIT_ENCRYPTED_OBSERVATION&per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python - "$RUNNER_TEMP/artifacts.json" "$GITHUB_OUTPUT" <<'PY'
          import json,os,re,subprocess,sys
          repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
          artifacts=json.load(open(sys.argv[1]))['artifacts']
          candidates=[x for x in artifacts if
                      x.get('name')=='KB3_3_LEAGUE_DAILY_REAL_PIT_ENCRYPTED_OBSERVATION'
                      and x.get('expired') is False
                      and isinstance(x.get('digest'),str)
                      and re.fullmatch(r'sha256:[a-f0-9]{64}',x['digest'])
                      and (x.get('workflow_run') or {}).get('head_branch')=='main']
          candidates.sort(key=lambda x:(x['created_at'],x['id']),reverse=True)
          newest=None
          for item in candidates:
              run_id=(item.get('workflow_run') or {}).get('id')
              if not isinstance(run_id,int):
                  continue
              response=subprocess.run(
                  ['gh','api',f'repos/{repo}/actions/runs/{run_id}'],
                  capture_output=True,text=True,timeout=25,check=True)
              run=json.loads(response.stdout)
              if (run.get('id') == run_id
                  and run.get('event') in ('schedule','workflow_dispatch')
                  and run.get('head_branch')=='main'
                  and run.get('head_sha')==item['workflow_run'].get('head_sha')
                  and run.get('path','').split('@')[0] ==
                      '.github/workflows/kb3-pitchapi-three-league-daily.yml'):
                  newest=item
                  break
          if newest is None:
              raise SystemExit('NO_AUTHENTIC_SCHEDULED_OR_MANUAL_CAPTURE_ARTIFACT')
          with open(sys.argv[2],'a') as o:
              for k,v in [('id',newest['id']),
                          ('created',newest['created_at']),
                          ('digest',newest['digest'])]:
                  print(k+'='+str(v),file=o)
          print('SELECTED_GENUINE_CAPTURE_ARCHIVE_ID',newest['id'],
                'HOST_CREATED',newest['created_at'],
                'CODE_PUSH_ARTIFACTS_REJECTED','NO_PROVIDER_API_CALLS')
          PY
      - name: Download exact artifact bytes and resolve receipt day, no provider connection
        id: download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.source.outputs.id }}/zip" > "$RUNNER_TEMP/hosted.zip"
          test -s "$RUNNER_TEMP/hosted.zip"
          python - "$RUNNER_TEMP/hosted.zip" "$GITHUB_OUTPUT" "${{ steps.source.outputs.created }}" <<'PY'
          import datetime,json,re,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              days=sorted({m.group(1) for n in z.namelist() if
                  (m:=re.fullmatch(
                   r'pit_sidecar/pitchapi_three_league_daily/(\\d{4}-\\d{2}-\\d{2})/THREE_LEAGUE_DAILY_RECEIPT\\.json',n))})
              if not days:
                  raise SystemExit('NO_GENUINE_DAILY_RECEIPT_IN_HOST_ARCHIVE')
              day=days[-1]
              prefix='pit_sidecar/pitchapi_three_league_daily/'+day+'/'
              receipt=json.loads(z.read(prefix+'THREE_LEAGUE_DAILY_RECEIPT.json'))
              if receipt.get('utc_day')!=day:
                  raise SystemExit('RECEIPT_UTC_DAY_MISMATCH')
              created=datetime.date.fromisoformat(sys.argv[3][:10])
              if (created-datetime.date.fromisoformat(day)).days not in (0,1):
                  raise SystemExit('STALE_CAPTURE_NOT_REHOSTED_AS_NEW_PIT')
              # Old immutable evidence may be absent; the validator below
              # will fail closed without inventing a snapshot.
              print('HOSTED_CAPTURE_RECEIPT_DAY',day,
                    'HAS_IMMUTABLE_LEDGER',(prefix+'M0_CAPTURE_LEDGER.sqlite') in z.namelist())
          with open(sys.argv[2],'a') as o:
              print('day='+day,file=o)
          PY
      - name: Validate GitHub ZIP digest, encrypted raw bytes, original 87 clocks and exact cutoff
        if: github.event_name != 'pull_request'
        run: |
          python -m scripts.kb3_catboost_v3_three_league_archive_preflight \
            --zip "$RUNNER_TEMP/hosted.zip" \
            --artifact-id "${{ steps.source.outputs.id }}" \
            --github-created-at "${{ steps.source.outputs.created }}" \
            --github-sha256 "${{ steps.source.outputs.digest }}" \
            --day "${{ steps.download.outputs.day }}" \
            --contract contracts/kb3_catboost_asof_v3.json \
            --out "$RUNNER_TEMP/KB3_CATBOOST_V3_THREE_LEAGUE_PREFLIGHT.json"
          python - "$RUNNER_TEMP/KB3_CATBOOST_V3_THREE_LEAGUE_PREFLIGHT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["official_v3_admitted_samples"]==0
          assert d["production_approved"] is False
          assert d["github_zip_sha256_verified"] is True
          assert d["encrypted_source_sha256_verified"] is True
          assert d["sqlite_ledger_sha256_verified"] is True
          assert d["sample_payload_sha256_verified"]==d["contract_87_fields_and_clocks_verified"]
          print('HOSTED_REAL_THREE_LEAGUE_RESEARCH_PREFLIGHT_ONLY',
                '87_VECTOR_COUNT',d['contract_87_fields_and_clocks_verified'],
                'EXACT_CUTOFF_HOSTED',d['hosted_before_existing_exact_feature_cutoff_count'],
                'FORMAL_V3_ADMITTED',d['official_v3_admitted_samples'])
          PY
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: KB3_V3_THREE_LEAGUE_SOURCE_READINESS_NO_FIT
          path: ${{ runner.temp }}/KB3_CATBOOST_V3_THREE_LEAGUE_PREFLIGHT.json
          retention-days: 30
          if-no-files-found: error
