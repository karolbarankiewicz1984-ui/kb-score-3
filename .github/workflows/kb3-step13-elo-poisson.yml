name: "KB3 Step 13 - ELO Poisson M0 Offline Math"
on:
  push:
    branches: ["feature/step13-*", "main"]
    paths:
      - "src/kb3_step13_baseline.py"
      - "src/kb3_step13_reference_metrics.py"
      - "src/kb3_step13_reference_report.py"
      - "src/kb3_step13_replay.py"
      - "src/kb3_step13_replay_report.py"
      - "tests/test_step13_baseline.py"
      - "tests/test_step13_reference_metrics.py"
      - "tests/test_step13_replay.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-elo-poisson.yml"
  pull_request:
    paths:
      - "src/kb3_step13_baseline.py"
      - "src/kb3_step13_reference_metrics.py"
      - "src/kb3_step13_reference_report.py"
      - "src/kb3_step13_replay.py"
      - "src/kb3_step13_replay_report.py"
      - "tests/test_step13_baseline.py"
      - "tests/test_step13_reference_metrics.py"
      - "tests/test_step13_replay.py"
      - "docs/STEP_13_PROGRESS.md"
      - ".github/workflows/kb3-step13-elo-poisson.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m0-math-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent Poisson and Elo invariants offline
        run: |
          python3 -m unittest discover -s tests -p 'test_step13*.py' -v
          python3 -m unittest discover -s tests -p 'test_step12_acceptance.py' -v
      - name: Generate synthetic-only immutable math reference
        run: |
          python3 -m src.kb3_step13_reference_report \
            --output data/audits/STEP13_M0_REFERENCE_2026-10-26.json
      - name: Generate strictly synthetic chronological replay and two history variants
        run: |
          python3 -m src.kb3_step13_replay_report \
            --out data/audits/STEP13_M0_SYNTHETIC_REPLAY_2026-10-26.json
      - name: Fail closed if someone advertises these results as history
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.kb3_split import sha
          p=Path("data/audits/STEP13_M0_REFERENCE_2026-10-26.json")
          j=json.loads(p.read_text())
          assert j["report_sha256"]==sha({k:v for k,v in j.items() if k!="report_sha256"})
          assert not j["gate13_pass"] and not j["training_allowed"]
          assert j["historical_sample_size"]==0 and not j["historical_metrics_available"]
          assert not j["is_real_historical_backtest"] and not j["trained_on_historical_data"]
          for x in j["mathematical_reference_forecasts"]:
            assert abs(sum(x["forecast"]["p_1x2"].values())-1)<1e-12
            assert x["forecast"]["parameters_status"]=="ILLUSTRATIVE_UNFITTED_NOT_FOR_BETTING"
          replay=json.loads(Path("data/audits/STEP13_M0_SYNTHETIC_REPLAY_2026-10-26.json").read_text())
          assert replay["report_sha256"]==sha({k:v for k,v in replay.items() if k!="report_sha256"})
          assert replay["real_historical_matches_scored"]==0 and not replay["gate13_pass"]
          assert replay["comparison"]["validation_paired"]
          assert replay["comparison"]["expanding"]["training_synthetic_candidate_count"]==2
          assert replay["comparison"]["rolling"]["training_synthetic_candidate_count"]==1
          assert not replay["model_fitted"] and not replay["historical_training_allowed"]
          print("STEP13_M0_REPLAY_SYNTHETIC_ONLY_HISTORICAL_EVIDENCE_PENDING")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kb3-step13-illustrative-m0-math-20261026
          path: |
            data/audits/STEP13_M0_REFERENCE_2026-10-26.json
            data/audits/STEP13_M0_SYNTHETIC_REPLAY_2026-10-26.json
          if-no-files-found: error
          retention-days: 90
      - name: Freeze first candidate report in feature branch
        if: github.ref == 'refs/heads/feature/step13-fold-replay-safety-v02'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/STEP13_M0_REFERENCE_2026-10-26.json data/audits/STEP13_M0_SYNTHETIC_REPLAY_2026-10-26.json
          if ! git diff --cached --quiet; then
            git commit -m "Step13: immutable synthetic-only M0 mathematical reference"
            git push origin "HEAD:feature/step13-fold-replay-safety-v02"
          else
            echo "Existing report verified immutable"
          fi
