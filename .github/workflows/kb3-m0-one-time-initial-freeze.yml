name: KB3 ONE-TIME real M0 121+38 SQLite initial prematch freeze
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kb3-m0-one-time-initial-freeze.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kb3-three-league-feature-db-write
  cancel-in-progress: false
jobs:
  real-initial-forward-m0-feature-freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pitch SDK and RSA public encryption
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Offline anti-leakage controls for original Step 11 feature aggregator and SQLite 001/002
        run: |
          python -m compileall -q src/kb3_three_league_sqlite_forward_features.py scripts/step14_three_league_pitchapi_daily_asof.py
          python -m unittest discover -s tests -p 'test_step14_three_league_sqlite_forward_features.py' -v
          python -m unittest discover -s tests -p 'test_step14_three_league_pitchapi_daily.py' -v
      - name: Real 3 league 43-call immediate freeze (separate UTC-day source namespace)
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          python -m scripts.step14_three_league_pitchapi_daily_asof \
            --base data/pit_sidecar/pitchapi_three_league_forward_initial \
            --public-key config/step11_archive_recipient_public.pem
      - name: Verify actual 12 before kickoff, 121+38 true observed features in SQLite
        run: |
          python - <<'PY'
          import json,sqlite3,datetime,hashlib
          from pathlib import Path
          day=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          folder=Path('data/pit_sidecar/pitchapi_three_league_forward_initial')/day
          receipt=json.loads((folder/'THREE_LEAGUE_DAILY_RECEIPT.json').read_text())
          db=Path('data/forward_m0/kb3_forward_m0.sqlite')
          assert receipt['frozen_M0_feature_snapshots']==12
          assert receipt['M0_feature_fields']==121 and receipt['M0_missing_flags']==38
          assert receipt['feature_sqlite_ledger_sha256']==hashlib.sha256(db.read_bytes()).hexdigest()
          with sqlite3.connect(db) as conn:
              assert conn.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert conn.execute('SELECT COUNT(*) FROM m0_forward_feature_records').fetchone()[0]==12
              assert conn.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]==0
              assert conn.execute('SELECT COUNT(*) FROM feature_snapshots').fetchone()[0]==12
              assert conn.execute('SELECT COUNT(*) FROM m0_forward_feature_records WHERE eligible_for_original_M1=1').fetchone()[0]==0
              assert conn.execute('PRAGMA foreign_key_check').fetchall()==[]
          assert receipt['original_Premier_League_2026_27_TEST_not_accessed']
          print('TRUE_12_FROZEN_121_NUMERIC_38_FLAGS_SQLITE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_M0_121_38_SQLITE_REAL_FORWARD_FREEZE_AND_RSA_SOURCE
          path: |
            data/forward_m0/kb3_forward_m0.sqlite
            data/pit_sidecar/pitchapi_three_league_forward_initial/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist real SQLite and source evidence in private main
        run: |
          git config user.name "kb3-feature-bot"
          git config user.email "kb3-feature-bot@users.noreply.github.com"
          git add -f data/forward_m0/kb3_forward_m0.sqlite
          git add -f data/pit_sidecar/pitchapi_three_league_forward_initial/*/THREE_LEAGUE_DAILY_SOURCE.enc
          git add -f data/pit_sidecar/pitchapi_three_league_forward_initial/*/THREE_LEAGUE_DAILY_SOURCE.manifest.json
          git add -f data/pit_sidecar/pitchapi_three_league_forward_initial/*/THREE_LEAGUE_DAILY_RECEIPT.json
          if git diff --cached --quiet; then
            echo 'Already archived real initial forward feature freeze.'
          else
            git commit -m 'm0: actual 12 pre-kickoff 121+38 features frozen in immutable SQLite'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
