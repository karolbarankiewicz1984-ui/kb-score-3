name: KB3 Step15 offline frozen scorecard integrity re-audit (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-step15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline checker and hardened independent verifier
        run: |
          python -m compileall -q scripts/step15_independent_market_audit.py scripts/step15_offline_reaudit.py
      - name: Fail closed on scoreline, BTTS, O/U, 1X2 or model integrity drift
        run: |
          python -m unittest discover -s tests -p 'test_step15_independent_market_audit.py' -v
          python -m unittest discover -s tests -p 'test_step15_offline_reaudit.py' -v
          python -m scripts.step15_offline_reaudit
