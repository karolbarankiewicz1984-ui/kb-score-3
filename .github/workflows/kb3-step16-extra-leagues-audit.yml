name: KB3 Step16 one-shot read-only added league eligibility audit
on:
  pull_request:
    paths:
      - scripts/step16_additional_leagues_audit.py
      - tests/test_step16_additional_leagues_audit.py
      - .github/workflows/kb3-step16-extra-leagues-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/step16_additional_leagues_audit.py
      - tests/test_step16_additional_leagues_audit.py
      - .github/workflows/kb3-step16-extra-leagues-audit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kb3-step16-once-extra-leagues-catalog
  cancel-in-progress: false
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptographic dependency required by existing helper imports
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Check full additional league safety tests without any provider API
        run: |
          python -m compileall -q scripts/step16_additional_leagues_audit.py
          python -m unittest discover -s tests -p 'test_step16_additional_leagues_audit.py' -v
  one-shot-real-provider-audit:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing official PitchAPI SDK
        run: python -m pip install --disable-pip-version-check 'pitchapi==0.1.6' 'cryptography>=42,<47'
      - name: Read only seven allowable added leagues, their two seasons, one xG witness
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: |
          if test -f data/audits/STEP16_ADDITIONAL_LEAGUES_LIVE_20261029.json; then
            echo 'ALREADY_FROZEN_LEAGUE_AUDIT'
          else
            python -m scripts.step16_additional_leagues_audit --output data/audits/STEP16_ADDITIONAL_LEAGUES_LIVE_20261029.json
          fi
      - name: Verify truthful evidence, zero protected TEST, no model writes
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from scripts.step16_additional_leagues_audit import digest,MAX_CALLS
          p=Path('data/audits/STEP16_ADDITIONAL_LEAGUES_LIVE_20261029.json')
          a=json.loads(p.read_text())
          assert digest({k:v for k,v in a.items() if k!='report_sha256'})==a['report_sha256']
          assert a['schema']=='kb3-step16-pitchapi-additional-leagues-readonly-feasibility-v1'
          assert a['provider_calls']<=MAX_CALLS
          assert a['candidate_count']==7
          assert all(x['country'] not in ('ESP','ITA','GER') for x in a['candidates'])
          assert all(not (x['country']=='ENG' and x['league']!='Championship') for x in a['candidates'])
          assert a['premier_league_2026_27_test_results_requested'] is False
          assert a['target_result_used_for_model_fitting'] is False
          assert a['original_m0_or_m1_changed'] is False
          assert a['new_leagues_live_pipeline_enabled'] is False
          print('STEP16_EXTRA_LEAGUES_AUDITED',a['verified_full_1xg_pair_count'],'OF',a['candidate_count'])
          for x in a['candidates']:
            print(x['country'],x['league'],x.get('reason'),x.get('ready'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB3_STEP16_PROVIDER_EXTRA_LEAGUES_SANITIZED_AUDIT
          path: data/audits/STEP16_ADDITIONAL_LEAGUES_LIVE_20261029.json
          retention-days: 30
      - name: Persist non-sensitive read-only coverage audit in private main
        run: |
          git config user.name 'kb3-step16-audit-bot'
          git config user.email 'kb3-step16-audit-bot@users.noreply.github.com'
          git add data/audits/STEP16_ADDITIONAL_LEAGUES_LIVE_20261029.json
          if git diff --cached --quiet; then
            echo 'Already persisted'
          else
            git commit -m 'step16: persist actual additional-league provider eligibility without TEST access'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
