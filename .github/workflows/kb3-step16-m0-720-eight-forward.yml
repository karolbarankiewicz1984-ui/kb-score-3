name: KB3 Step16 parallel fitted M0 720-TRAIN eight league forward research
on:
  pull_request:
    paths:
      - src/kb3_step16_m0_720_eight_forward.py
      - src/kb3_step16_run_policy.py
      - tests/test_m0720_operations.py
      - src/kb3_step17_forward_challengers.py
      - tests/test_step17_forward_challengers.py
      - src/kb3_step17_challenger_provenance.py
      - tests/test_step17_challenger_provenance.py
      - src/kb3_p1_prospective_shadow_six_v1.py
      - src/kb3_p1_shadow_live_gate.py
      - scripts/kb3_p1_shadow_activation_policy.py
      - scripts/kb3_shadow_first_real_checkpoint.py
      - tests/test_kb3_shadow_first_real_checkpoint.py
      - config/kb3_shadow_six_forward_activation.json
      - tests/test_kb3_p1_shadow_live_integration.py
      - config/kb3_shadow_six_pinned_research_model.json
      - scripts/step16_m0_720_eight_run.py
      - scripts/step16_m0_mode_guard.py
      - tests/test_step16_m0_mode_guard.py
      - tests/test_step16_m0_720_eight_forward.py
      - tests/test_step16_m0_720_calibration.py
      - src/kb3_step16_m0_720_calibration.py
      - config/step16_ci_requirements.txt
      - config/step16_live_requirements.txt
      - .github/workflows/kb3-step16-m0-720-eight-forward.yml
  push:
    branches: [main]
    paths:
      - src/kb3_step16_m0_720_eight_forward.py
      - src/kb3_step16_run_policy.py
      - tests/test_m0720_operations.py
      - src/kb3_step17_forward_challengers.py
      - tests/test_step17_forward_challengers.py
      - src/kb3_step17_challenger_provenance.py
      - tests/test_step17_challenger_provenance.py
      - src/kb3_p1_prospective_shadow_six_v1.py
      - src/kb3_p1_shadow_live_gate.py
      - scripts/kb3_p1_shadow_activation_policy.py
      - scripts/kb3_shadow_first_real_checkpoint.py
      - tests/test_kb3_shadow_first_real_checkpoint.py
      - config/kb3_shadow_six_forward_activation.json
      - tests/test_kb3_p1_shadow_live_integration.py
      - config/kb3_shadow_six_pinned_research_model.json
      - scripts/step16_m0_720_eight_run.py
      - tests/test_step16_m0_720_eight_forward.py
      - config/step16_ci_requirements.txt
      - config/step16_live_requirements.txt
      - .github/workflows/kb3-step16-m0-720-eight-forward.yml
  schedule:
    - cron: '21 6,9,12 * * *'
    - cron: '17 8,14,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (forecast/settle)'
        required: true
        type: choice
        options: [forecast, settle]
        default: forecast
permissions:
  contents: write
  actions: read
concurrency:
  group: kb3-step16-eight-league-m0-720-research-db
  cancel-in-progress: false
jobs:
  anti-leakage-and-data-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: config/step16_ci_requirements.txt
      - name: Install existing public encryption support
        run: python -m pip install --disable-pip-version-check -r config/step16_ci_requirements.txt
      - name: Check research params, eight league domains, real chronology, immutable SQLite
        run: |
          python -m compileall -q src/kb3_step16_m0_720_eight_forward.py src/kb3_step16_m0_720_calibration.py scripts/step16_m0_720_eight_run.py
          python -m unittest discover -s tests -p 'test_step16_m0_720_eight_forward.py' -v
          python -m unittest discover -s tests -p 'test_step16_m0_720_calibration.py' -v
          python -m unittest discover -s tests -p 'test_step17_forward_challengers.py' -v
          python -m unittest discover -s tests -p 'test_step17_challenger_provenance.py' -v
          python -m unittest discover -s tests -p 'test_step16_m0_mode_guard.py' -v
          python -m unittest discover -s tests -p 'test_m0720_operations.py' -v
  real-eighth-league-fitted-M0-shadow:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: anti-leakage-and-data-safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          # Scheduled event SHA can be stale after waiting for concurrency.
          ref: refs/heads/main
      - name: Verify current main checkout before provider mode selection
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: config/step16_live_requirements.txt
      - name: Choose mode; redundant scheduled attempts skip API if already recorded
        id: mode
        env:
          EVENT_KIND: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          USER_MODE: ${{ inputs.mode }}
        run: python -m scripts.step16_m0_mode_guard
      # The activation policy imports the forward M0 feature builder, which
      # imports cryptography. Install the pinned live packages first; neither
      # the install nor the policy invokes the sports provider API.
      - name: Install already used PitchAPI SDK and source evidence encryption
        if: steps.mode.outputs.mode != 'skip'
        run: python -m pip install --disable-pip-version-check -r config/step16_live_requirements.txt
      - name: Check explicit research-only Shadow Six activation for NEW main-branch forecasts
        id: shadow_activation
        if: steps.mode.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python -m scripts.kb3_p1_shadow_activation_policy
      - name: Restore immutable reviewed CatBoost Shadow Six bytes from tracked research assets (OFF by default)
        if: steps.mode.outputs.mode == 'forecast' && steps.shadow_activation.outputs.enabled == 'true'
        env:
          KB3_SHADOW_SIX_MODEL_DIR: ${{ runner.temp }}/kb3_shadow_six
        run: |
          python - <<'PY'
          import json,hashlib,os,pathlib,shutil
          from src.kb3_p1_shadow_live_gate import pinned_model_details
          pin=pinned_model_details()
          source=pathlib.Path('assets/research/kb3_shadow_six_v1')
          dest=pathlib.Path(os.environ['KB3_SHADOW_SIX_MODEL_DIR'])
          names=(pin['model_filename'],pin['manifest_filename'])
          for name in names:
              assert (source/name).is_file(), 'DURABLE_EXACT_SHADOW_RESEARCH_BINARY_REQUIRED'
          assert hashlib.sha256((source/names[0]).read_bytes()).hexdigest()==pin['model_sha256'], 'SHADOW_DURABLE_BINARY_SHA_INVALID'
          manifest=json.loads((source/names[1]).read_text())
          assert manifest['manifest_sha256']==pin['manifest_sha256']
          assert manifest['model_binary_sha256']==pin['model_sha256']
          assert manifest['production_approved'] is False
          dest.mkdir(parents=True,exist_ok=True)
          for name in names:
              shutil.copy2(source/name,dest/name)
          print('PINNED_SHADOW_SIX_DURABLY_RESTORED_NO_ARTIFACT_EXPIRY_DEPENDENCY')
          PY
      - name: Real encrypted before-kickoff research forecast or verified postmatch
        if: steps.mode.outputs.mode != 'skip'
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          KB3_SHADOW_SIX_ENABLED: ${{ steps.shadow_activation.outputs.enabled }}
          KB3_SHADOW_SIX_MODEL_DIR: ${{ runner.temp }}/kb3_shadow_six
        run: python -m scripts.step16_m0_720_eight_run --mode "$RUN_MODE"
      - name: Verify full immutable independent database and no legacy DB modification
        if: steps.mode.outputs.mode != 'skip'
        run: |
          python - <<'PY'
          import sqlite3,json
          from pathlib import Path
          from src.kb3_step16_m0_720_eight_forward import MODEL,trained_params
          db=Path('data/forward_m0_720_eight/kb3_forward_eight.sqlite')
          assert db.is_file()
          params,sha,manifest=trained_params()
          with sqlite3.connect(db) as cn:
              assert cn.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert cn.execute('PRAGMA foreign_key_check').fetchall()==[]
              assert cn.execute('SELECT model,parameters_sha256,manifest_sha256 FROM model_meta').fetchall()==[(MODEL,sha,manifest)]
              f=cn.execute('SELECT COUNT(*) FROM forecasts').fetchone()[0]
              s=cn.execute('SELECT COUNT(*) FROM settlements').fetchone()[0]
              assert f>=s and f>=0
              assert cn.execute("SELECT COUNT(*) FROM forecasts WHERE league='ENG'").fetchone()[0]==0
          print('REAL_EIGHT_LEAGUE_RESEARCH_M0',f,s,'ORIGINAL_TEST_EXCLUDED')
          from src.kb3_step17_forward_challengers import SCHEMA as STEP17_SCHEMA,CBM_SHA
          import hashlib
          model=Path('models/research/M1_R_BASE_CATBOOST_720_TRAIN_2026-10-29.cbm')
          assert hashlib.sha256(model.read_bytes()).hexdigest()==CBM_SHA
          with sqlite3.connect(db) as cn:
              cn.executescript(STEP17_SCHEMA)
              count=cn.execute('SELECT COUNT(*) FROM step17_frozen_challengers').fetchone()[0]
              paired=cn.execute('SELECT COUNT(DISTINCT source_m0_forecast_sha256) FROM step17_frozen_challengers').fetchone()[0]
              assert count==2*paired and count>=0
              assert cn.execute('SELECT COUNT(*) FROM step17_frozen_challengers WHERE league=\'ENG\'').fetchone()[0]==0
              print('STEP17_M0_MATCHED_CHALLENGER_FREEZE',count,paired,'PRODUCTION_BLOCKED')
          from src.kb3_step17_challenger_provenance import ensure
          with sqlite3.connect(db) as cn:
              cn.execute('PRAGMA foreign_keys=ON')
              ensure(cn)
              verified=cn.execute('SELECT COUNT(*) FROM step17_challenger_host_proofs').fetchone()[0]
              assert 0<=verified<=count
              print('STEP17_REAL_CHALLENGER_HOST_ATTESTED',verified,'OF',count)
          # The candidate and review cannot be production approved by an action.
          from src.kb3_step16_m0_720_calibration import ensure_schema
          with sqlite3.connect(db) as cn:
              cn.execute('PRAGMA foreign_keys=ON')
              ensure_schema(cn)
              assert cn.execute('SELECT COUNT(*) FROM m0720_calibrators WHERE production_approved != 0').fetchone()[0]==0
              assert cn.execute('SELECT COUNT(*) FROM m0720_holdout_reviews WHERE production_approved != 0').fetchone()[0]==0
          PY
      - name: Check first genuine M0 and Shadow capture, host proof and settlement (read-only)
        if: steps.mode.outputs.mode != 'skip'
        run: python -m scripts.kb3_shadow_first_real_checkpoint
      - uses: actions/upload-artifact@v4
        if: always() && steps.mode.outputs.mode != 'skip'
        with:
          name: KB3_STEP16_M0_720_EIGHT_LEAGUE_FREEZE_SETTLEMENT_SOURCE_EVIDENCE
          path: |
            data/forward_m0_720_eight/
            data/forecasts/m0_720_eight/
            data/pit_sidecar/m0_720_eight/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist completely separate immutable research samples in private main
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name 'kb3-step16-forward-bot'
          git config user.email 'kb3-step16-forward-bot@users.noreply.github.com'
          if test -d data/forward_m0_720_eight; then git add -f data/forward_m0_720_eight/; fi
          if test -d data/forecasts/m0_720_eight; then git add -f data/forecasts/m0_720_eight/; fi
          if test -d data/pit_sidecar/m0_720_eight; then git add -f data/pit_sidecar/m0_720_eight/; fi
          if git diff --cached --quiet; then
            echo 'No new independent M0-720 research files.'
          else
            git commit -m 'kb3 step16: 8 league fixed M0-720 real pregame and result samples'
            # A competing writer may advance main during a read-only settle.
            # NEVER rebase a forecast, SQLite DB, updated proof or model change.
            # A non-overlapping, newly added immutable receipt can be rebased
            # without changing its bytes or rerunning the provider API.
            if ! git push origin HEAD:main; then
              git fetch origin main
              # Only entirely NEW files are safe. Reject any overwrite,
              # deletion or rename even when it lives under the ledger path.
              if git diff-tree --no-commit-id --name-status -r HEAD | grep -v '^A[[:space:]]'; then
                echo "::error::M0_RESEARCH_NOT_APPEND_ONLY_NO_REBASE"
                exit 1
              fi
              mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
              if test "${#changed[@]}" -eq 0; then
                echo "::error::M0_RESEARCH_EMPTY_COMMIT_ON_PUSH_REJECT"
                exit 1
              fi
              for path in "${changed[@]}"; do
                case "$path" in
                  data/pit_sidecar/m0_720_eight/*) ;;
                  *)
                    echo "::error::M0_RESEARCH_BINARY_OR_FORECAST_CHANGED_NO_REBASE"
                    exit 1
                    ;;
                esac
                # An already published path cannot be overwritten by a retry.
                if git cat-file -e "origin/main:$path" 2>/dev/null; then
                  echo "::error::M0_RESEARCH_RECEIPT_PATH_ALREADY_EXISTS_NO_REBASE"
                  exit 1
                fi
              done
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::M0_RESEARCH_RECEIPT_REBASE_CONFLICT_KEEP_ARTIFACT"
                exit 1
              fi
              if ! git push origin HEAD:main; then
                echo "::error::M0_RESEARCH_PUSH_REJECTED_KEEP_ORIGINAL_ARTIFACT"
                exit 1
              fi
              echo 'M0_RESEARCH_ONLY_NEW_IMMUTABLE_RECEIPTS_REBASED'
            fi
          fi
